<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Borsa Dostu{% endblock %}</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .navbar {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .navbar .brand {
            font-size: 18px;
            font-weight: 700;
            color: #f0f6fc;
        }
        .navbar a { color: #8b949e; font-size: 14px; }
        .navbar a:hover { color: #f0f6fc; text-decoration: none; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        h1 { font-size: 24px; color: #f0f6fc; margin-bottom: 16px; }
        h2 { font-size: 18px; color: #f0f6fc; margin-bottom: 12px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            font-size: 14px;
        }
        th {
            background: #1c2128;
            color: #8b949e;
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            border-bottom: 1px solid #30363d;
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
        }
        tr:hover { background: #1c2128; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; }
        .green { color: #26a69a; }
        .red { color: #ef5350; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; color: #8b949e; }
        .form-group input, .form-group select {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #2ea043; }

        .search-box {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 12px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .info-item {
            background: #1c2128;
            padding: 12px;
            border-radius: 6px;
        }
        .info-item .label { font-size: 12px; color: #8b949e; }
        .info-item .value { font-size: 18px; font-weight: 600; color: #f0f6fc; margin-top: 4px; }

        .chart-container { width: 100%; min-height: 500px; margin-top: 16px; margin-left: 0; padding-left: 0; overflow-x: auto; }
        .chart-container .js-plotly-plot { margin-left: 0 !important; }

        .error { background: #3d1f28; border: 1px solid #f85149; color: #f85149; padding: 12px; border-radius: 6px; margin-bottom: 16px; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }

        .footer { border-top: 1px solid #30363d; padding: 20px; margin-top: 40px; text-align: center; font-size: 12px; color: #8b949e; }
        .footer a { color: #8b949e; }
        .footer a:hover { color: #f0f6fc; }
        .footer-links { display: flex; justify-content: center; gap: 16px; margin-top: 6px; }

        .lang-switch { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: #8b949e; }
        .lang-switch span { cursor: pointer; }
        .lang-switch span.active { color: #f0f6fc; font-weight: 600; }
        .lang-toggle { position: relative; width: 36px; height: 18px; background: #30363d; border-radius: 9px; cursor: pointer; border: none; padding: 0; }
        .lang-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #58a6ff; border-radius: 50%; transition: transform 0.2s; }
        .lang-toggle.en::after { transform: translateX(18px); }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13,17,23,0.85);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .loading-overlay.active { display: flex; }
        .spinner-candle { display: flex; align-items: flex-end; gap: 6px; height: 56px; }
        .c1 { width: 8px; height: 20px; border-radius: 2px; transform-origin: bottom; background: #3fb950; animation: c1 1.2s ease-in-out infinite; }
        .c2 { width: 8px; height: 32px; border-radius: 2px; transform-origin: bottom; background: #f85149; animation: c2 1.2s ease-in-out infinite; }
        .c3 { width: 8px; height: 14px; border-radius: 2px; transform-origin: bottom; background: #3fb950; animation: c3 1.2s ease-in-out infinite; }
        .c4 { width: 8px; height: 28px; border-radius: 2px; transform-origin: bottom; background: #f85149; animation: c4 1.2s ease-in-out infinite; }
        .c5 { width: 8px; height: 38px; border-radius: 2px; transform-origin: bottom; background: #3fb950; animation: c5 1.2s ease-in-out infinite; }
        .loading-text { color: #8b949e; font-size: 14px; }
        @keyframes c1 { 0%,100% { transform: scaleY(0.85); opacity: 0.4; } 50% { transform: scaleY(1.25); opacity: 1; } }
        @keyframes c2 { 0%,20% { transform: scaleY(0.85); opacity: 0.4; } 50% { transform: scaleY(1.25); opacity: 1; } 80%,100% { transform: scaleY(0.85); opacity: 0.4; } }
        @keyframes c3 { 0%,30% { transform: scaleY(0.85); opacity: 0.4; } 60% { transform: scaleY(1.25); opacity: 1; } 90%,100% { transform: scaleY(0.85); opacity: 0.4; } }
        @keyframes c4 { 0%,40% { transform: scaleY(0.85); opacity: 0.4; } 70% { transform: scaleY(1.25); opacity: 1; } 100% { transform: scaleY(0.85); opacity: 0.4; } }
        @keyframes c5 { 0%,50% { transform: scaleY(0.85); opacity: 0.4; } 80% { transform: scaleY(1.25); opacity: 1; } 100% { transform: scaleY(0.85); opacity: 0.4; } }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; }
            .chart-container { min-height: 350px; }
            .info-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">Borsa Dostu</a>
        <a href="/bist">BIST</a>
        <a href="/viop">VIOP</a>
        <div class="lang-switch">
            <span class="{{ 'active' if lang == 'tr' }}" onclick="window.location='/lang/tr'">TR</span>
            <button class="lang-toggle {{ lang }}" onclick="window.location='/lang/{{ 'tr' if lang == 'en' else 'en' }}'"></button>
            <span class="{{ 'active' if lang == 'en' }}" onclick="window.location='/lang/en'">EN</span>
        </div>
    </nav>
    <div class="loading-overlay" id="loading">
        <div class="spinner-candle"><div class="c1"></div><div class="c2"></div><div class="c3"></div><div class="c4"></div><div class="c5"></div></div>
        <div class="loading-text">{{ t.loading }}</div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer class="footer">
        <div>&copy; 2026 Borsa Dostu</div>
        <div class="footer-links">
            <a href="mailto:berkegemenoguz@gmail.com">berkegemenoguz@gmail.com</a>
            <span>·</span>
            <a href="https://github.com/berkegemenoguz/borsadostu" target="_blank">GitHub</a>
        </div>
    </footer>
    <script>
    document.querySelectorAll("form").forEach(function(f){
        f.addEventListener("submit", function(){ document.getElementById("loading").classList.add("active"); });
    });
    document.querySelectorAll("a[href*='/bist/'], a[href*='/viop/']").forEach(function(a){
        a.addEventListener("click", function(){ document.getElementById("loading").classList.add("active"); });
    });
    </script>
</body>
</html>
