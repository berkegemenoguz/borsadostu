{% extends "base.html" %}
{% block title %}VIOP — Borsa Dostu{% endblock %}
{% block content %}
<h1>VIOP Stock Futures <span style="color:#8b949e; font-size:16px; font-weight:400;">{{ count }} stocks</span></h1>
<div style="overflow-x:auto;">
    <table>
        <thead>
            <tr>
                <th style="width:50px;">#</th>
                <th>Stock</th>
                <th class="text-right">Contracts</th>
                <th class="text-right">Total Volume</th>
            </tr>
        </thead>
        <tbody>
            {% for r in rows %}
            <tr>
                <td class="text-center mono">{{ loop.index }}</td>
                <td><a href="/viop/{{ r.base }}" class="mono">{{ r.base }}</a></td>
                <td class="text-right mono">{{ r.kontrat }}</td>
                <td class="text-right mono">{{ "{:,.0f}".format(r.hacim) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
