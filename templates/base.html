<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Borsa Dostu{% endblock %}</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .navbar {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .navbar .brand {
            font-size: 18px;
            font-weight: 700;
            color: #f0f6fc;
        }
        .navbar a { color: #8b949e; font-size: 14px; }
        .navbar a:hover { color: #f0f6fc; text-decoration: none; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        h1 { font-size: 24px; color: #f0f6fc; margin-bottom: 16px; }
        h2 { font-size: 18px; color: #f0f6fc; margin-bottom: 12px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            font-size: 14px;
        }
        th {
            background: #1c2128;
            color: #8b949e;
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            border-bottom: 1px solid #30363d;
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
        }
        tr:hover { background: #1c2128; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; }
        .green { color: #26a69a; }
        .red { color: #ef5350; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; color: #8b949e; }
        .form-group input, .form-group select {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #2ea043; }

        .search-box {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 12px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .info-item {
            background: #1c2128;
            padding: 12px;
            border-radius: 6px;
        }
        .info-item .label { font-size: 12px; color: #8b949e; }
        .info-item .value { font-size: 18px; font-weight: 600; color: #f0f6fc; margin-top: 4px; }

        .chart-container { width: 100%; min-height: 500px; margin-top: 16px; }

        .error { background: #3d1f28; border: 1px solid #f85149; color: #f85149; padding: 12px; border-radius: 6px; margin-bottom: 16px; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; }
            .chart-container { min-height: 350px; }
            .info-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">Borsa Dostu</a>
        <a href="/bist">BIST</a>
        <a href="/viop">VIOP</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
